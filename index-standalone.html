<script>
// fixed per-subject seeds, arbitrary but documented -- this app only needs to be internally
// deterministic/reproducible. DELIBERATELY DIFFERENT from the previous experiment's seeds so a
// subject who took part in both doesn't get a correlated trial order across the two studies.
// there's no user-entered trial label anymore (main.js generates a timestamp-based run id
// instead) -- this just hashes whatever string it's given into a seed
function seedForTrialLabel(label) {
  label = String(label);
  let hash = 2166136261;
  for (let i = 0; i < label.length; i += 1) {
    hash ^= label.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

// trial-count design: 20 reps x 8 conditions = 160 trials, run as a SINGLE session. Each
// condition's 20 reps split evenly across STIMULUS_DURATIONS (10 at each duration), via the same
// assignBalancedDurations machinery as before -- see triallist.js. To change the budget, keep
//   N_REPS * (number of conditions) === N_SESSIONS * SESSION_SIZE, and keep SESSION_SIZE
//   divisible by N_TRIAL_TO_BREAK * BLOCKS_PER_RUN * RUNS_PER_SESSION.
const N_REPS = 20;
const N_SESSIONS = 1;
const SESSION_SIZE = 160;

// practice block sizes. day 1 (first-ever session): a single 20-trial easy+medium mixed block
// w/ feedback. every later session: 20 easy+medium mixed w/ feedback, 20 more w/o feedback = 40
// total. see DIFFICULTY_TIERS in conditions.js and buildDay1PracticeBlocks/
// buildRepeatPracticeBlocks in triallist.js. N_SESSIONS is 1 here, so only the day-1 block
// actually runs -- the repeat path is kept intact in case the design later grows to multiple
// sessions.
const N_PRACTICE_MIXED_DAY1 = 20;
const N_PRACTICE_MIXED_REPEAT = 20;

// each session is 1 run x 2 blocks x 80 trials/block = 160, so there's a single break at the
// midpoint
const N_TRIAL_TO_BREAK = 80;
const RUNS_PER_SESSION = 1;
const BLOCKS_PER_RUN = 2;
const BREAK_DURATION = 30;

// single tunable knob for every visual-angle size in the experiment (aperture, dots, fixation,
// legend, prompt offset) -- multiplies the base degree values below and in expt_util.js
const VISUAL_ANGLE_SCALE = 1.0;

// dot display parameters, degrees of visual angle -- placeholders pending real display
// calibration, carried over unchanged from the previous experiment. NOTE: this design's densest
// condition is 100+80+70+30 = 280 dots, well under the previous experiment's 160+... maximum, so
// the existing aperture/dot radii have more than enough room for non-overlapping placement.
const APERTURE_RADIUS_DEG = 8.0 * VISUAL_ANGLE_SCALE;
const DOT_RADIUS_DEG = 0.15 * VISUAL_ANGLE_SCALE;

// response keys for the decision phase, one key per color -- unchanged, so a subject who has run
// the previous experiment keeps the same motor mapping
const COLOR_KEYS = { orange: 'h', green: 'j', blue: 'k', magenta: 'l' };

// response keys for the confidence phase, 1 (low) to 4 (high)
const CONFIDENCE_KEYS = ['1', '2', '3', '4'];

// stimulus durations: short/long, chosen from the duration pilot (see README) -- each of the 8
// conditions runs at both.
const STIMULUS_DURATIONS = [200, 500];

// `top` is counts[0] and ratio_1..3 are counts[i]/top, derived in conditions.js from the literal
// counts -- ratio_3 is always blank on 3-choice trials, as before.
const CSV_HEADER = 'date,time,sid,seed,gain_orange,gain_green,gain_blue,gain_magenta,session,trial,duration,n_choice,condition_id,top,ratio_1,ratio_2,ratio_3,colors,counts,stim,resp,acc,rt,conf,c_rt';

// color-matching calibration: 4 sliders (one per color), each dims that color's base hex toward
// black -- gain 1.0 is unadjusted, CALIBRATION_FLOOR is the dimmest allowed; the slider itself
// never exceeds 1.0 (see colors.js). subject repeats the match N_COLOR_CALIBRATION_REPS times,
// each starting from an independent random slider position, and the final per-color gain is the
// average across all reps
const CALIBRATION_FLOOR = 0.20;
const CALIBRATION_DOTS_PER_COLOR = 80;
const N_COLOR_CALIBRATION_REPS = 2;

const COLOR_CSV_HEADER = 'date,time,sid,seed,trial,gain_orange,gain_green,gain_blue,gain_magenta';

// shown before the virtual chinrest. this study is a single session, so the "returning" variant
// is currently unreachable -- it's kept (and still selected by the same isFirstSession flag) so
// raising N_SESSIONS is a one-constant change
const CHINREST_INTRO_TEXT_FIRST = `
  <p>Welcome to the experiment!</p>
  <p>We will first measure your viewing distance and monitor size.</p>
  <p>Once measured, please keep your seating position and screen where they are for the rest of the session.</p>
  <p>Press spacebar whenever you're ready.</p>
`;

const CHINREST_INTRO_TEXT_RETURNING = `

  <p>We will first measure your viewing distance and monitor size.</p>
  <p>Make sure you are using the same monitor as you've used in previous sessions.</p>
  <p>Press spacebar whenever you're ready.</p>
`;

// shown as the very first screen of the experiment, before the trial label is even
// entered. the previous experiment's monitor-consistency line is dropped here (nothing to be
// consistent with in a single-session study) and replaced with a seating/lighting reminder, since
// the chinrest calibration holds only for as long as the subject stays put.
const PRE_CHECK_TEXT = `
  <div style="font-size:1.2em; font-weight:bold;">
    <p>Before you continue, please make sure:</p>
    <p>1. Your browser zoom level is 100%.</p>

`;

// text markup for the two-screen pre-calibration instructions -- illustration on top before any
// written instructions, with a larger font than the experiment's other instruction text (see
// style.css's --text-scale) since this pairs with an illustration and needs to read clearly at a
// glance. img src/displayWidthPx are computed at runtime in color_calibration.js (that file loads
// after this one, so it has access to the canvas/color-gain helpers this template doesn't need

      <p>You will see a cloud of colored dots, similar to the example shown above.</p>
      <p>Use the Right Arrow key, or click Next, to continue.</p>
    </div>
  `;
}

// second calibration instructions page: plain text, no illustration -- the real sliders/button
// are shown on the very next screen, so there's nothing extra to mock up here
function buildColorCalibrationMappingText() {

    <div style="font-size:1.4em;">
      <p>You will see four sliders labeled Red, Green, Blue, and Yellow, each starting at a random position.</p>
      <p>Drag the sliders until no single color looks more salient than the others in the dot cloud.</p>
      <p>Once you're satisfied, click Confirm.</p>
      <p>You will repeat this ${N_COLOR_CALIBRATION_REPS} times.</p>
      <p>Use the Right Arrow key, or click Next, to begin.</p>
    </div>
  `;
}

// trial counts are interpolated from the same constants that drive the actual session structure
// (RUNS_PER_SESSION/BLOCKS_PER_RUN/N_TRIAL_TO_BREAK above) so this text can't drift out of sync,
// same reasoning as buildMainInstructionsPages in main_instructions.js
function buildTransitionText() {
  return `
    <div style="font-size:1.4em;">
      <p>Good job! You have completed the practice trials.</p>
      <p>You will now perform ${RUNS_PER_SESSION} runs of ${BLOCKS_PER_RUN} blocks, with each block containing ${N_TRIAL_TO_BREAK} trials.</p>
      <p>No feedback will be given during the experimental trials.</p>
      <p>Make sure to try your best!</p>
      <p>Press any key to continue.</p>
    </div>
  `;
}

// single-session study, so finishing a session finishes the study -- the previous experiment's
// "return next week" line is gone. STUDY_COMPLETE_TEXT below still exists for the case where a
// subject reopens the page after already finishing.
const SESSION_COMPLETE_TEXT = `
  <div style="font-size:1.4em;">
    <p>You have completed the experiment!</p>
    <p>Make sure to save all the files before closing this window.</p>
  </div>
`;
const SAVE_FAILED_TEXT = `
  <div style="font-size:1.4em;">
    <p>There was an error saving your data.</p>
    <p>Please try again later.</p>
  </div>
`;

// shown above the "Save Data to Computer" button on the local-backup screen at the end of every
// session -- placeholder wording
const LOCAL_SAVE_PROMPT_TEXT = 'As a backup, please also save a copy of your data to your own computer.';

const STUDY_COMPLETE_TEXT = '<p>Hurray! You have completed this study. Thank you for participating!</p>';

</script>

<script>
// Equiluminant 4 palette (see palette-review-final.html) -- equal CAM16 lightness and
// colorfulness, hues spaced evenly, replacing the old full-saturation RGBY primaries
const COLORS = {
  orange: '#D78426',
  green: '#56B16E',
  blue: '#40A4E4',
  magenta: '#CA79C4',
};

// numeric codes for raw data output, keeps color columns text-free
const COLOR_CODES = {
  orange: 1,
  green: 2,
  blue: 3,
  magenta: 4,
};

// insertion order (orange, green, blue, magenta) matters -- it feeds the permutation generator below
const COLOR_NAMES = Object.keys(COLORS);

// 'orange' -> 'Orange', for subject-facing text -- COLOR_NAMES/correct_color are always lowercase
// internally, so every screen that names a color in prose (instructions, feedback) goes through this
function capitalizeColorName(color) {
  return color.charAt(0).toUpperCase() + color.slice(1);
}

// scales a #RRGGBB hex color's channels by `gain`, clamped to the valid 0-255 range per channel --
// clamping (not just rounding) is what keeps an already-saturated channel (255) from overflowing
// when gain > 1, and keeps a heavily-dimmed channel from going negative
function applyGain(hex, gain) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const clamp = v => Math.max(0, Math.min(255, Math.round(v * gain)));
  const toHex = v => v.toString(16).padStart(2, '0');
  return `#${toHex(clamp(r))}${toHex(clamp(g))}${toHex(clamp(b))}`;
}

// per-color multiplier applied on top of the base COLORS palette -- 1.0 means unadjusted. the
// calibration slider only ever runs 0..1 (CALIBRATION_FLOOR..1 in config.js), so gain never
// exceeds 1.0 in practice. starting the staircase at 75% leaves headroom to move a color both
// brighter and dimmer during matching
const DEFAULT_START_GAIN = 0.75;
const DEFAULT_COLOR_GAINS = { orange: DEFAULT_START_GAIN, green: DEFAULT_START_GAIN, blue: DEFAULT_START_GAIN, magenta: DEFAULT_START_GAIN };

function getGainedColors(gains) {
  const gained = {};
  COLOR_NAMES.forEach(c => { gained[c] = applyGain(COLORS[c], gains[c]); });
  return gained;
}

// colors actually used for drawing during practice/main trials, set once color calibration
// resolves (a fresh staircase result or a prior session's saved gains) -- COLORS itself stays the
// fixed, un-gained base palette so gains are always computed relative to the same reference
let ACTIVE_COLORS = { ...COLORS };

function setActiveColors(gains) {
  ACTIVE_COLORS = getGainedColors(gains);
}

</script>

<script>
// raw csv text for the new experiment's condition set. UNLIKE the previous experiment's
// conditions.csv (which stored a `top` count plus ratios of it), this design is specified
// directly in dot counts, so counts are the source of truth here and `top`/`ratios` are derived
// below. that keeps the saved data file's columns (top, ratio_1..ratio_3) byte-compatible with
// the previous experiment's output while letting a future condition be any arbitrary set of
// counts, not just clean multiples of a shared top.
//
// design: 3 three-choice conditions + 5 four-choice conditions = 8 total. no two-choice
// conditions in this experiment.
const CONDITIONS_CSV = `n_choice,count_1,count_2,count_3,count_4
3,100,70,70,
3,100,80,60,
3,100,90,50,
4,100,80,50,50
4,100,80,65,35
4,100,70,55,55
4,100,70,70,40
4,100,60,60,60`;

// choice-set sizes present in this experiment -- previously hard-coded as [2, 3, 4] in several
// places, pulled out here so triallist.js and buildDifficultyTiers stay in sync with the csv
const N_CHOICE_SIZES = [3, 4];

// parse the embedded csv into CONDITIONS = {3:[...], 4:[...]}, preserving each row's position
// within its n_choice group -- that position is the condition_id used everywhere else, so row
// order here must stay identical to the design table above.
//
// each parsed condition carries:
//   counts  - the literal dot counts, rank-ordered (most dots first)
//   top     - counts[0], the winning color's count (kept for the data file's `top` column)
//   ratios  - counts[i]/top for i > 0 (kept for the data file's ratio_1..3 columns, and used by
//             buildDifficultyTiers below to rank difficulty)
function parseConditions(csvText) {
  const lines = csvText.trim().split('\n').slice(1);
  const conditions = {};
  N_CHOICE_SIZES.forEach(n => { conditions[n] = []; });

  lines.forEach(line => {
    const cells = line.split(',');
    const nChoice = parseInt(cells[0], 10);
    const counts = cells.slice(1, 1 + nChoice).map(Number);
    const top = counts[0];
    const ratios = counts.slice(1).map(c => c / top);
    conditions[nChoice].push({ counts, top, ratios });
  });

  return conditions;
}

const CONDITIONS = parseConditions(CONDITIONS_CSV);

// pools every condition across all n_choice sizes into 3 difficulty tiers, ranked by ratio1
// (ratios[0]) -- smaller ratio1 means a bigger gap between the top and 2nd-place color, i.e.
// easier. unchanged from the previous experiment except that it now splits 8 conditions (3/3/2)
// instead of 75 (25/25/25); the divmod sizing already handled any pool size. used by the
// practice-trial builders in triallist.js: day 1 draws separately from easy and medium, every
// later session draws from the two pooled together. hard is computed but not used by practice.
//
// with only 8 conditions the tiers are coarse -- easy is [100,70,55,55], [100,60,60,60],
// [100,80,65,35] and hard is [100,80,60], [100,80,50,50], [100,90,50]. worth revisiting if
// practice feels mis-pitched, since ratio1 alone ignores how many distractors sit just behind the
// leader.
function buildDifficultyTiers() {
  const flat = [];
  N_CHOICE_SIZES.forEach(nChoice => {
    CONDITIONS[nChoice].forEach((cond, conditionId) => {
      flat.push({
        n_choice: nChoice, condition_id: conditionId,
        top: cond.top, ratios: cond.ratios, counts: cond.counts,
      });
    });
  });

  // ties keep csv row order, since Array.prototype.sort is a stable sort
  flat.sort((a, b) => a.ratios[0] - b.ratios[0]);

  const n = flat.length;
  const base = Math.floor(n / 3);
  const extra = n % 3;
  const sizes = [base + (extra > 0 ? 1 : 0), base + (extra > 1 ? 1 : 0), base];

  const easy = flat.slice(0, sizes[0]);
  const medium = flat.slice(sizes[0], sizes[0] + sizes[1]);
  const hard = flat.slice(sizes[0] + sizes[1]);

  return { easy, medium, hard, easyMedium: easy.concat(medium) };
}

const DIFFICULTY_TIERS = buildDifficultyTiers();

</script>

<script>
// mulberry32: small, well-tested seeded pseudo-random generator, returns a function that yields
// floats in [0,1), same call signature as Math.random
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// fisher-yates shuffle using a seeded rng function (rng() must return a float in [0,1))
function shuffle(array, rng) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// indices that would sort arr ascending, ties broken by original index -- mirrors the greedy
// "give the extra trial to whichever session currently holds the fewest" balancing idiom
function argsortAscending(arr) {
  return arr.map((_, i) => i).sort((a, b) => arr[a] - arr[b]);
}

</script>

<script>
// permutations of `arr` taken `r` at a time, in the same order Python's itertools.permutations
// would produce for a list of unique elements (lexicographic by input position)
function permutations(arr, r) {
  const results = [];
  const used = new Array(arr.length).fill(false);

  function extend(current) {
    if (current.length === r) {
      results.push(current.map(i => arr[i]));
      return;
    }
    for (let i = 0; i < arr.length; i++) {
      if (used[i]) continue;
      used[i] = true;
      extend([...current, i]);
      used[i] = false;
    }
  }

  extend([]);
  return results;
}

</script>

<script>
// builds all sessions' worth of trials for one subject, deterministically from their seed.
// structurally the same as the previous experiment's builder -- balance condition reps across
// sessions, then balance correct-color counts within each session -- with two changes forced by
// this design:
//
//   1. choice sizes come from N_CHOICE_SIZES (conditions.js), which is [3, 4] here. no
//      two-choice conditions.
//   2. the per-condition permutation cycle is REFILLED when exhausted. the previous experiment
//      handed each condition only 9-10 trials per session, always fewer than the 24 available
//      colour permutations, so a single shuffled cycle always sufficed. this design has 8
//      conditions instead of 75, so each one gets 90 trials per session -- the cycle runs out
//      partway through and has to be reshuffled, exactly as buildPracticeTriallistFromPool
//      already does below. without the refill the color picker would run off the end of an empty
//      list and throw.
// keyFn is the fine-grained cell duration is balanced within (so it can't get correlated with,
// e.g., correct color); correctionKeyFn is the coarser grouping the two-level fixup below targets
// an exact split for (e.g. condition alone, ignoring color) -- defaults to keyFn so a single-key
// caller (buildPracticeTriallistFromPool) is unaffected
function assignBalancedDurations(trials, keyFn, rng, correctionKeyFn = keyFn) {
  const groups = {};
  trials.forEach(trial => {
    const key = keyFn(trial);
    if (!groups[key]) groups[key] = [];
    groups[key].push(trial);
  });

  const oddGroups = [];
  Object.values(groups).forEach(group => {
    const durations = Array.from({ length: group.length }, (_, i) =>
      STIMULUS_DURATIONS[i % STIMULUS_DURATIONS.length]);
    shuffle(durations, rng);
    if (group.length % STIMULUS_DURATIONS.length !== 0) oddGroups.push({ group, durations });
    group.forEach((trial, i) => { trial.duration = durations[i]; });
  });

  // For the two-level manipulation, distribute odd-cell extras across levels so that EVERY
  // correction-key's own trials land exactly half at each duration whenever that count is even --
  // done per correction-key (not globally), so e.g. every condition hits an exact split instead of
  // only the session as a whole. Odd-groups are only swapped against others sharing the same
  // correction key, so a fix for one condition can't borrow from another's imbalance.
  if (STIMULUS_DURATIONS.length === 2) {
    const firstDuration = STIMULUS_DURATIONS[0];
    const trialsByCorrectionKey = {};
    trials.forEach(trial => {
      const key = correctionKeyFn(trial);
      (trialsByCorrectionKey[key] ||= []).push(trial);
    });
    const oddGroupsByCorrectionKey = {};
    oddGroups.forEach(entry => {
      const key = correctionKeyFn(entry.group[0]);
      (oddGroupsByCorrectionKey[key] ||= []).push(entry);
    });

    Object.keys(trialsByCorrectionKey).forEach(key => {
      const keyTrials = trialsByCorrectionKey[key];
      const firstCount = keyTrials.filter(trial => trial.duration === firstDuration).length;
      const targetFirst = Math.floor(keyTrials.length / STIMULUS_DURATIONS.length);
      const groupsToSwap = firstCount - targetFirst;
      const odds = shuffle((oddGroupsByCorrectionKey[key] || []).slice(), rng);
      odds.slice(0, groupsToSwap).forEach(({ group }) => {
        group.forEach(trial => {
          trial.duration = trial.duration === firstDuration
            ? STIMULUS_DURATIONS[1] : firstDuration;
        });
      });
    });
  }
}

function buildSubjectSessions(subjectId) {
  const seed = seedForTrialLabel(subjectId);
  const rng = mulberry32(seed);
  console.log(`subject ${subjectId}, seed ${seed}`);

  const sessions = Array.from({ length: N_SESSIONS }, () => []);
  const sessionTotals = new Array(N_SESSIONS).fill(0);
  const sessionColorCounts = Array.from({ length: N_SESSIONS }, () => ({ orange: 0, green: 0, blue: 0, magenta: 0 }));

  // groups a list of permutations by their rank-0 (correct) color
  const groupByCorrectColor = perms => {
    const byColor = { orange: [], green: [], blue: [], magenta: [] };
    perms.forEach(perm => byColor[perm[0]].push(perm));
    return byColor;
  };

  N_CHOICE_SIZES.forEach(nChoice => {
    const cycle = permutations(COLOR_NAMES, nChoice);

    CONDITIONS[nChoice].forEach((cond, conditionId) => {
      // how many of this condition's N_REPS land in each session -- the remainder is handed to
      // whichever sessions currently hold the fewest total trials
      const base = Math.floor(N_REPS / N_SESSIONS);
      const extra = N_REPS % N_SESSIONS;
      const priority = argsortAscending(sessionTotals);
      const extraSessions = new Set(priority.slice(0, extra));

      for (let s = 0; s < N_SESSIONS; s++) {
        const k = base + (extraSessions.has(s) ? 1 : 0);
        sessionTotals[s] += k;

        // walk a shuffled permutation cycle grouped by rank-0 (correct) color, greedily handing
        // each trial to whichever color is currently most under-represented in this session --
        // keeps every session's correct-color counts within 1 of each other at every step, so
        // after 720 trials (divisible by 4) they land at exactly 180 each. the cycle is
        // reshuffled from scratch whenever every color's bucket is empty, so each full sweep of
        // the 24 permutations is used once before any of them repeats.
        let byColor = groupByCorrectColor(shuffle(cycle.slice(), rng));

        for (let t = 0; t < k; t++) {
          let available = COLOR_NAMES.filter(c => byColor[c].length > 0);
          if (available.length === 0) {
            byColor = groupByCorrectColor(shuffle(cycle.slice(), rng));
            available = COLOR_NAMES.filter(c => byColor[c].length > 0);
          }

          available = shuffle(available, rng);
          const color = available.reduce((best, c) =>
            (sessionColorCounts[s][c] < sessionColorCounts[s][best] ? c : best), available[0]);
          const perm = byColor[color].pop();
          sessionColorCounts[s][color] += 1;

          sessions[s].push({
          n_choice: nChoice, condition_id: conditionId, top: cond.top, ratios: cond.ratios,
          colors: perm.slice(), counts: cond.counts.slice(), correct_color: perm[0], session: s + 1,
          });
        }
      }
    });
  });

  // balance duration inside each condition/color cell before order randomization, so the factor
  // cannot become correlated with either the condition or the correct response color
  sessions.forEach((session, s) => {
    assignBalancedDurations(
      session,
      trial => `${trial.n_choice}:${trial.condition_id}:${trial.correct_color}`,
      rng,
      trial => `${trial.n_choice}:${trial.condition_id}`,
    );
    shuffle(session, rng);
    const durationCounts = {};
    session.forEach(trial => { durationCounts[trial.duration] = (durationCounts[trial.duration] || 0) + 1; });
    console.log(`subject ${subjectId}, session ${s + 1}, duration counts`, durationCounts);
  });
  return sessions;
}

// distributes `total` items across `nBuckets` as evenly as possible, remainder handed to the
// first buckets -- same divmod idiom used throughout this file
function distributeCounts(total, nBuckets) {
  const base = Math.floor(total / nBuckets);
  const extra = total % nBuckets;
  return Array.from({ length: nBuckets }, (_, i) => base + (i < extra ? 1 : 0));
}

// practice trials drawn from a difficulty-tier condition pool (DIFFICULTY_TIERS in conditions.js):
// nTotal trials split evenly across whichever choice-sizes are present in the pool, then spread
// across that choice-size's pool conditions (round-robin over a shuffled order). colors are
// assigned via a shuffled permutation cycle shared across the whole choice-size group, reshuffled
// whenever exhausted, keeping the block close to color-balanced without requiring reps to be a
// multiple of the cycle length.
//
// note this design's pools are small (3 conditions in easy, 3 in medium, 6 in easy+medium), so
// unlike the previous experiment a practice block now repeats each pooled condition several
// times rather than sampling distinct ones -- unavoidable with 8 conditions total, and harmless
// since practice is never saved.
function buildPracticeTriallistFromPool(nTotal, pool, rng) {
  const choiceSizes = shuffle(N_CHOICE_SIZES.filter(n => pool.some(c => c.n_choice === n)), rng);
  const countsByChoice = {};
  distributeCounts(nTotal, choiceSizes.length).forEach((count, i) => { countsByChoice[choiceSizes[i]] = count; });

  let trials = [];
  choiceSizes.forEach(nChoice => {
    const total = countsByChoice[nChoice];
    if (total === 0) return;

    const conditionOrder = shuffle(pool.filter(c => c.n_choice === nChoice), rng);
    const perConditionCounts = distributeCounts(total, conditionOrder.length);
    let colorCycle = [];

    conditionOrder.forEach((cond, i) => {
      const reps = perConditionCounts[i];
      for (let r = 0; r < reps; r++) {
        if (colorCycle.length === 0) colorCycle = shuffle(permutations(COLOR_NAMES, nChoice), rng);
        const colors = colorCycle.pop();
        trials.push({
          n_choice: nChoice, condition_id: cond.condition_id, top: cond.top, ratios: cond.ratios,
          colors: colors.slice(), counts: cond.counts.slice(), correct_color: colors[0],
        });
      }
    });
  });

  assignBalancedDurations(trials, trial => `${trial.n_choice}:${trial.condition_id}`, rng);

  shuffle(trials, rng);
  return trials;
}

// day-1 (first-ever session) practice: a single 20-trial easy+medium mixed block w/ feedback.
// this is the only practice path that runs while N_SESSIONS is 1.
function buildDay1PracticeBlocks(rng) {
  return [
    { trials: buildPracticeTriallistFromPool(N_PRACTICE_MIXED_DAY1, DIFFICULTY_TIERS.easyMedium, rng), feedback: true },
  ];
}

// every later session's practice: 20 easy+medium mixed w/ feedback, then 20 more w/o feedback --
// 40 total. unreachable while N_SESSIONS is 1; kept so raising that constant needs no other edit.
function buildRepeatPracticeBlocks(rng) {
  return [
    { trials: buildPracticeTriallistFromPool(N_PRACTICE_MIXED_REPEAT, DIFFICULTY_TIERS.easyMedium, rng), feedback: true },
    { trials: buildPracticeTriallistFromPool(N_PRACTICE_MIXED_REPEAT, DIFFICULTY_TIERS.easyMedium, rng), feedback: false },
  ];
}

</script>

<script>
// rejection-sample dot centers uniformly within the aperture (by area, not bunched at center) so
// no two dots overlap, regardless of the color eventually assigned to them -- same algorithm as
// the pilot's generate_dot_positions. uses plain Math.random, not the subject's seeded rng, since
// dot layout is visual only and never needs to be reproduced for cross-day resume
function generateDotPositions(nDots, apertureRadius, dotRadius, maxAttempts = 500) {
  const positions = [];
  const placeRadius = apertureRadius - dotRadius;
  let attempts = 0;

  while (positions.length < nDots) {
    attempts += 1;
    if (attempts > maxAttempts * nDots) {
      throw new Error(`could not place ${nDots} non-overlapping dots in ${attempts} attempts, lower dot_radius or raise aperture_radius`);
    }

    // r = placeRadius * sqrt(uniform) samples uniformly by area, not bunched at center
    const r = placeRadius * Math.sqrt(Math.random());
    const theta = Math.random() * 2 * Math.PI;
    const candidate = [r * Math.cos(theta), r * Math.sin(theta)];

    if (positions.length === 0) {
      positions.push(candidate);
      continue;
    }

    const minDist = positions.reduce((min, p) =>
      Math.min(min, Math.hypot(p[0] - candidate[0], p[1] - candidate[1])), Infinity);
    if (minDist >= 2 * dotRadius) positions.push(candidate);
  }

  return positions;
}

// positions are generated color-agnostic, then counts-many copies of each color are shuffled
// independently and zipped to positions -- zero positional correlation with color, same approach
// as the pilot's build_dot_stim
function buildDotCloud(trial) {
  const nTotal = trial.counts.reduce((a, b) => a + b, 0);
  const positions = generateDotPositions(nTotal, APERTURE_RADIUS_DEG, DOT_RADIUS_DEG);

  const colorLabels = [];
  trial.colors.forEach((color, i) => {
    for (let j = 0; j < trial.counts[i]; j++) colorLabels.push(color);
  });
  shuffle(colorLabels, Math.random);

  return positions.map((pos, i) => ({ pos, color: colorLabels[i] }));
}

</script>

<script>
// tracks the most recent save request so the session-complete screen can wait for the real
// upload to finish, instead of a fixed timer disconnected from the actual network call -- shared
// by session_flow.js (main/practice data) and color_calibration.js (calibration data)
let lastSaveResponse = Promise.resolve();

// true only once the newest queued save has been confirmed by the server -- false from the moment
// any save starts until it (or a retry of it) actually succeeds, so a save that's mid-retry or has
// exhausted every retry both correctly read as "not safely saved yet"
let lastSaveOk = true;

// set false the first time fetchProgress (session_flow.js) can't reach progress.php -- covers
// both file:// (fetch throws outright) and a plain static host with no PHP handler (404, not
// valid JSON). Once false, saveSessionData/saveColorData skip enqueueSave entirely instead of
// retrying against endpoints that don't exist: without this, every trial's failed save would
// retry with backoff (up to ~15s each) in a queue that falls further behind all session long, and
// the session-complete screen would sit waiting on that backlog instead of moving straight to the
// local CSV download (buildLocalSaveTrial), which works with no server either way
let serverAvailable = true;

// warns before the tab/window closes while the latest save hasn't been confirmed -- browsers
// replace any custom message with their own generic prompt, but the listener has to call
// preventDefault/set returnValue for that prompt to appear at all
window.addEventListener('beforeunload', function (e) {
  if (!lastSaveOk) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// posts JSON to url, retrying transient failures (network errors, or non-2xx responses -- a bare
// fetch never rejects on e.g. a 500, so response.ok has to be checked by hand) with exponential
// backoff. only rejects once every retry is exhausted, so a caller seeing this reject means the
// server truly never accepted the save, not just a single dropped request
async function postJsonWithRetry(url, payload, maxRetries = 4, baseDelayMs = 1000) {
  let lastError;
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(`save request to ${url} failed with status ${res.status}`);
      const body = await res.text();
      try {
        return JSON.parse(body);
      } catch (error) {
        if (!['localhost', '127.0.0.1'].includes(location.hostname)) throw error;
        return { ok: true, staticTest: true };
      }
    } catch (err) {
      lastError = err;
      if (attempt < maxRetries) {
        await new Promise(resolve => setTimeout(resolve, baseDelayMs * 2 ** attempt));
      }
    }
  }
  throw lastError;
}

// single shared write queue for every save endpoint (save.php and save_color.php) -- each call is
// chained after the previous one instead of firing immediately, so two saves in flight can never
// finish out of order and have the smaller/older payload overwrite the larger/newer one on disk.
// also the one place lastSaveOk/lastSaveResponse get updated, so both save.php and save_color.php
// share the same beforeunload guard and session-complete success check
let saveQueue = Promise.resolve();

function enqueueSave(url, payload) {
  lastSaveOk = false;
  const attempt = saveQueue.then(() => postJsonWithRetry(url, payload));
  saveQueue = attempt.then(() => {}, () => {});
  lastSaveResponse = attempt.then(
    result => { lastSaveOk = true; return result; },
    err => { lastSaveOk = false; throw err; },
  );
  return lastSaveResponse;
}

// triggers a browser download of csvText as filename -- the local backup copy prompted at the end
// of every session, independent of whether the server-side save (save.php, via enqueueSave above)
// actually succeeded
function downloadCsvText(filename, csvText) {
  const blob = new Blob([csvText], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function csvField(value) {
  const str = String(value);
  return str.includes(',') ? `"${str}"` : str;
}

function formatDate(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
}

function formatTime(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

// px-per-degree from this session's virtual-chinrest calibration, looked up once and cached --
// unlike the template's bug of leaving stimulus size in fixed pixels, every degree-based size in
// this file is converted through this value
let cachedPxPerDeg = null;

function getPxPerDeg() {
  if (cachedPxPerDeg === null) {
    const chinrestData = jsPsych.data.get().filter({ trial_type: 'virtual-chinrest' });
    cachedPxPerDeg = parseFloat(chinrestData.select('px2deg').values[0]);
  }
  return cachedPxPerDeg;
}

// jsPsych's canvas-keyboard-response plugin takes canvas_size as [height, width], not
// [width, height] -- easy to get backwards, and doing so silently draws a transposed canvas
function getCanvasSize() {
  return [window.innerHeight, window.innerWidth];
}

function canvasCenter(canvas) {
  return [canvas.width / 2, canvas.height / 2];
}

// two concentric outlined circles, same shape as the pilot's fixation
function drawFixation(canvas) {
  const ctx = canvas.getContext('2d');
  const [cx, cy] = canvasCenter(canvas);
  const pxPerDeg = getPxPerDeg();
  ctx.strokeStyle = 'white';
  ctx.lineWidth = 4;
  [0.25, 0.5].forEach(rDeg => {
    ctx.beginPath();
    ctx.arc(cx, cy, rDeg * VISUAL_ANGLE_SCALE * pxPerDeg, 0, 2 * Math.PI);
    ctx.stroke();
  });
}

// draws this trial's dot cloud, converting degrees to pixels via this session's calibration
function drawStimulus(canvas, trial) {
  const ctx = canvas.getContext('2d');
  const [cx, cy] = canvasCenter(canvas);
  const pxPerDeg = getPxPerDeg();
  const dotRadiusPx = DOT_RADIUS_DEG * pxPerDeg;

  buildDotCloud(trial).forEach(dot => {
    const x = cx + dot.pos[0] * pxPerDeg;
    const y = cy - dot.pos[1] * pxPerDeg;
    ctx.beginPath();
    ctx.arc(x, y, dotRadiusPx, 0, 2 * Math.PI);
    ctx.fillStyle = ACTIVE_COLORS[dot.color];
    ctx.fill();
  });
}

// dedicated dot-cloud builder for the color-calibration task: a fixed 4-color, equal-N cloud.
// returns color labels (not baked-in hex) so a caller can redraw the same fixed positions at
// different gains -- e.g. color_calibration.js's sliders redraw live while dragging without
// re-running rejection sampling on every 'input' event
function buildCalibrationDotCloud(nDotsPerColor) {
  const nTotal = nDotsPerColor * COLOR_NAMES.length;
  const positions = generateDotPositions(nTotal, APERTURE_RADIUS_DEG, DOT_RADIUS_DEG);

  const colorLabels = [];
  COLOR_NAMES.forEach(color => { for (let j = 0; j < nDotsPerColor; j++) colorLabels.push(color); });
  shuffle(colorLabels, Math.random);

  return positions.map((pos, i) => ({ pos, color: colorLabels[i] }));
}

// redraws a calibration dot cloud (fixed positions/labels from buildCalibrationDotCloud) at the
// given gains -- called on every slider drag, so this only recolors, it never re-places dots
function drawCalibrationStimulus(canvas, dotCloud, gains) {
  const ctx = canvas.getContext('2d');
  const [cx, cy] = canvasCenter(canvas);
  const pxPerDeg = getPxPerDeg();
  const dotRadiusPx = DOT_RADIUS_DEG * pxPerDeg;
  const gainedColors = getGainedColors(gains);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  dotCloud.forEach(dot => {
    const x = cx + dot.pos[0] * pxPerDeg;
    const y = cy - dot.pos[1] * pxPerDeg;
    ctx.beginPath();
    ctx.arc(x, y, dotRadiusPx, 0, 2 * Math.PI);
    ctx.fillStyle = gainedColors[dot.color];
    ctx.fill();
  });
}

// yOffsetDeg is how far ABOVE center the text sits -- default matches the decision/confidence
// trials, which never have a stimulus on screen at the same time. the calibration screen does, so
// it passes a larger offset to clear the dot cloud (see drawCalibrationStimulus)
function drawPrompt(canvas, text, yOffsetDeg = 4 * VISUAL_ANGLE_SCALE) {
  const ctx = canvas.getContext('2d');
  const [cx, cy] = canvasCenter(canvas);
  const pxPerDeg = getPxPerDeg();
  ctx.fillStyle = 'white';
  ctx.font = `${24 * VISUAL_ANGLE_SCALE}px Avenir Next, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(text, cx, cy - yOffsetDeg * pxPerDeg);
}

// grey fill for legend buttons whose color isn't a valid response this trial (2-choice and
// 3-choice trials don't use all 4 colors) -- keeps the button/key visible without revealing
// which colors are actually in play
const UNAVAILABLE_LEGEND_COLOR = '#999999';

// fixed color-key legend, same four rectangles every trial so the key mapping never has to be
// memorized -- all 4 buttons are always drawn, but only the colors present this trial (validColors)
// show their real color; the rest are greyed out. yOffsetDeg is how far BELOW center the row sits
// (default matches the decision trial, which has no stimulus on screen at the same time);
// colorMap defaults to the resolved ACTIVE_COLORS but the calibration screen passes this trial's
// own gained colors, since ACTIVE_COLORS isn't set until calibration finishes
function drawColorLegend(canvas, validColors, yOffsetDeg = 5 * VISUAL_ANGLE_SCALE, colorMap = ACTIVE_COLORS) {
  const ctx = canvas.getContext('2d');
  const [cx, cy] = canvasCenter(canvas);
  const pxPerDeg = getPxPerDeg();
  // .map scales each fixed legend x-position by the same visual-angle factor as everything else
  const legendXDeg = [-9, -3, 3, 9].map(x => x * VISUAL_ANGLE_SCALE);
  const rectWidthPx = 4 * VISUAL_ANGLE_SCALE * pxPerDeg;
  const rectHeightPx = 3 * VISUAL_ANGLE_SCALE * pxPerDeg;

  COLOR_NAMES.forEach((color, i) => {
    const x = cx + legendXDeg[i] * pxPerDeg;
    const y = cy + yOffsetDeg * pxPerDeg;

    ctx.fillStyle = validColors.includes(color) ? colorMap[color] : UNAVAILABLE_LEGEND_COLOR;
    ctx.strokeStyle = 'white';
    ctx.fillRect(x - rectWidthPx / 2, y - rectHeightPx / 2, rectWidthPx, rectHeightPx);
    ctx.strokeRect(x - rectWidthPx / 2, y - rectHeightPx / 2, rectWidthPx, rectHeightPx);

    ctx.fillStyle = 'black';
    ctx.font = `bold ${20 * VISUAL_ANGLE_SCALE}px Avenir Next, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(COLOR_KEYS[color].toUpperCase(), x, y);
  });
}

function drawFeedback(canvas, acc, correctColor) {
  const ctx = canvas.getContext('2d');
  const [cx, cy] = canvasCenter(canvas);
  ctx.fillStyle = acc ? '#00FF00' : '#FF0000';
  ctx.font = `bold ${72 * VISUAL_ANGLE_SCALE}px Avenir Next, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(acc ? 'O' : 'X', cx, cy);

  // wrong trials also state the correct color below the X, since accuracy feedback alone doesn't
  // tell the subject what they should have picked
  if (!acc) {
    drawPrompt(canvas, `The correct answer is ${capitalizeColorName(correctColor)}.`, -4 * VISUAL_ANGLE_SCALE);
  }
}

// Ending the active jsPsych trial lets the timeline replay it from the beginning after a pause.
// The wrapper is used only around response/stimulus trials, so a replay cannot save duplicate data.
function makePauseableTrial(trials) {
  return {
    timeline: [
      {
        timeline: [{
          type: jsPsychHtmlKeyboardResponse,
          stimulus: '',
          choices: [' '],
          data: { phase: 'pause_gate' },
        }],
        conditional_function: function () { return pauseActive; },
      },
      ...(Array.isArray(trials) ? trials : [trials]),
    ],
    on_timeline_start: function () {
      setPauseHintVisible(true);
    },
    on_timeline_finish: function () { setPauseHintVisible(false); },
    loop_function: function () { return pauseRequested; },
  };
}

function makeFixationTrial() {
  return {
    type: jsPsychCanvasKeyboardResponse,
    canvas_size: getCanvasSize,
    stimulus: drawFixation,
    choices: 'NO_KEYS',
    trial_duration: 500,
    data: { phase: 'fixation' },
  };
}

function makeStimulusTrial(trial) {
  if (trial.duration === undefined) {
    throw new Error('stimulus trial is missing a duration');
  }

  return {
    type: jsPsychCanvasKeyboardResponse,
    canvas_size: getCanvasSize,
    stimulus: function (canvas) { drawStimulus(canvas, trial); },
    choices: 'NO_KEYS',
    trial_duration: trial.duration,
    data: { phase: 'stimulus' },
  };
}

// only the colors actually shown in this trial are valid responses. `result` is a plain object
// shared with this trial's confidence/feedback nodes so they don't need to re-query jsPsych's own
// recorded data to find out what just happened
function makeDecisionTrial(trial, result) {
  const validKeys = trial.colors.map(c => COLOR_KEYS[c]);
  return {
    type: jsPsychCanvasKeyboardResponse,
    canvas_size: getCanvasSize,
    stimulus: function (canvas) {
      drawPrompt(canvas, 'Which color had the most dots?');
      drawColorLegend(canvas, trial.colors);
    },
    choices: validKeys,
    data: { phase: 'decision' },
    on_finish: function (data) {
      const respColor = Object.keys(COLOR_KEYS).find(c => COLOR_KEYS[c] === data.response);
      result.resp = respColor;
      result.acc = respColor === trial.correct_color ? 1 : 0;
      result.rt = data.rt / 1000;
    },
  };
}

function makeConfidenceTrial(result, onDone) {
  return {
    type: jsPsychCanvasKeyboardResponse,
    canvas_size: getCanvasSize,
    stimulus: function (canvas) { drawPrompt(canvas, 'How confident are you? (1 = low, 4 = high)'); },
    choices: CONFIDENCE_KEYS,
    data: { phase: 'confidence' },
    on_finish: function (data) {
      if (pauseRequested) return;
      result.conf = Number(data.response);
      result.c_rt = data.rt / 1000;
      if (onDone) onDone();
    },
  };
}

// flat hold for every feedback trial, correct or wrong -- Doby reported not having enough time
// to read "The correct answer is X." before the next trial started at the old 500ms
const FEEDBACK_DURATION = 700;

function makeFeedbackTrial(trial, result) {
  return {
    type: jsPsychCanvasKeyboardResponse,
    canvas_size: getCanvasSize,
    stimulus: function (canvas) { drawFeedback(canvas, result.acc, trial.correct_color); },
    choices: 'NO_KEYS',
    trial_duration: FEEDBACK_DURATION,
    data: { phase: 'feedback' },
  };
}

</script>

<script>
// preview illustrations are rendered at PREVIEW_SCALE of the REAL on-screen stimulus/legend size,
// reusing the actual degree-based sizes (APERTURE_RADIUS_DEG, DOT_RADIUS_DEG, drawColorLegend's
// layout) converted through this session's real pxPerDeg -- available here because these screens
// run after the virtual chinrest. rendered at PREVIEW_SUPERSAMPLE x the target size and displayed
// at 1/PREVIEW_SUPERSAMPLE via the <img> width (see buildStimulusPreviewScreen below) so the image
// stays crisp on high-DPI screens
const PREVIEW_GAIN = 0.75;
const PREVIEW_SCALE = 0.6;
const PREVIEW_SUPERSAMPLE = 2;

// renders a drawing function onto an offscreen canvas and returns it as a data URL, for embedding
// as a static <img> inside instruction HTML
function renderPreviewImage(widthPx, heightPx, drawFn) {
  const canvas = document.createElement('canvas');
  canvas.width = widthPx;
  canvas.height = heightPx;
  drawFn(canvas.getContext('2d'), widthPx / 2, heightPx / 2);
  return canvas.toDataURL();
}

// example dot cloud at a fixed 75% luminance for all four colors -- same dot cloud generator
// (buildCalibrationDotCloud) and real degree-based sizes as the actual calibration stimulus, just
// scaled down to PREVIEW_SCALE of its real on-screen size
function drawStimulusPreview(ctx, cx, cy) {
  const gains = { orange: PREVIEW_GAIN, green: PREVIEW_GAIN, blue: PREVIEW_GAIN, magenta: PREVIEW_GAIN };
  const gainedColors = getGainedColors(gains);
  const pxPerDeg = getPxPerDeg() * PREVIEW_SCALE * PREVIEW_SUPERSAMPLE;
  const dotRadiusPx = DOT_RADIUS_DEG * pxPerDeg;

  buildCalibrationDotCloud(CALIBRATION_DOTS_PER_COLOR).forEach(dot => {
    ctx.beginPath();
    ctx.arc(cx + dot.pos[0] * pxPerDeg, cy - dot.pos[1] * pxPerDeg, dotRadiusPx, 0, 2 * Math.PI);
    ctx.fillStyle = gainedColors[dot.color];
    ctx.fill();
  });
}

// builds the stimulus-example instruction screen's HTML at trial runtime (not timeline-build
// time), since getPxPerDeg() only resolves after the virtual chinrest trial has actually run --
// passed to jsPsych as a stimulus function, evaluated when this trial starts
function buildStimulusPreviewScreen() {
  const pxPerDeg = getPxPerDeg() * PREVIEW_SCALE * PREVIEW_SUPERSAMPLE;
  const nativePx = Math.ceil(2 * APERTURE_RADIUS_DEG * pxPerDeg + 20);
  const imgSrc = renderPreviewImage(nativePx, nativePx, drawStimulusPreview);
  return buildColorCalibrationStimulusText(imgSrc, nativePx / PREVIEW_SUPERSAMPLE);
}

// final per-color gain is the average of the confirmed slider settings across every rep
function computeAverageGains(repGains) {
  const sums = { orange: 0, green: 0, blue: 0, magenta: 0 };
  repGains.forEach(g => COLOR_NAMES.forEach(c => { sums[c] += g[c]; }));
  const n = repGains.length;
  const avg = {};
  COLOR_NAMES.forEach(c => { avg[c] = sums[c] / n; });
  return avg;
}

function buildColorTrialInfo(gains, subjectId, seed, trialIndex) {
  const now = new Date();
  return {
    date: formatDate(now), time: formatTime(now),
    sid: subjectId, seed: seed, trial: trialIndex,
    gain_orange: gains.orange, gain_green: gains.green, gain_blue: gains.blue, gain_magenta: gains.magenta,
  };
}

function colorRowToCsvLine(row) {
  const fields = [
    row.date, row.time, row.sid, row.seed, row.trial,
    row.gain_orange, row.gain_green, row.gain_blue, row.gain_magenta,
  ];
  return fields.map(csvField).join(',');
}

// re-posts the whole accumulated calibration history after every rep, overwriting the file in
// place server-side -- same crash-safe philosophy as saveSessionData. enqueueSave (expt_util.js)
// adds retry-with-backoff and write-ordering, and shares its lastSaveOk/beforeunload guard with
// the main session data saves
function saveColorData(subjectId, rows) {
  if (!serverAvailable) return Promise.resolve();
  const csvText = COLOR_CSV_HEADER + '\n' + rows.map(colorRowToCsvLine).join('\n');
  return enqueueSave('save_color.php', { subject_id: subjectId, csv: csvText });
}

// rebuilds calibration state from this subject's saved _COLOR.csv rows (empty array if the file
// doesn't exist yet): each row is one confirmed rep, complete once N_COLOR_CALIBRATION_REPS have
// been recorded -- crash-safe, mirrors how resolveSessionPlan resumes a partially-saved session
function deriveColorCalibrationState(colorRows) {
  if (!colorRows.length) {
    return { complete: false, gains: { ...DEFAULT_COLOR_GAINS }, repGains: [], rows: [], trialIndex: 0 };
  }

  const repGains = colorRows.map(r => ({
    orange: Number(r.gain_orange), green: Number(r.gain_green), blue: Number(r.gain_blue), magenta: Number(r.gain_magenta),
  }));
  const complete = repGains.length >= N_COLOR_CALIBRATION_REPS;

  return {
    complete,
    gains: complete ? computeAverageGains(repGains) : { ...DEFAULT_COLOR_GAINS },
    repGains,
    rows: colorRows,
    trialIndex: colorRows.length,
  };
}

// canvas is sized to exactly fit the aperture (not the full window, unlike the main task's
// stimulus canvas), since it sits alongside the slider sidebar rather than filling the screen
function calibrationCanvasSizePx() {
  const pxPerDeg = getPxPerDeg();
  return Math.ceil(2 * APERTURE_RADIUS_DEG * pxPerDeg + 20);
}

// dot cloud canvas on the left, one labeled range slider per color plus a Confirm button on the
// right -- built as a plain HTML string (like every other jsPsych trial in this codebase), wired
// up via on_load in makeCalibrationRepTrial below
function buildCalibrationTrialHtml() {
  const canvasSizePx = calibrationCanvasSizePx();
  const sliderRows = COLOR_NAMES.map(color => `
    <div style="display:flex; flex-direction:column; margin-bottom:20px; width:240px;">
      <label for="calib-slider-${color}" style="text-transform:capitalize; font-weight:bold; margin-bottom:4px;">${color}</label>
      <input type="range" id="calib-slider-${color}" min="${CALIBRATION_FLOOR}" max="1" step="0.01">
    </div>
  `).join('');

  return `
    <div style="display:flex; align-items:center; justify-content:center; gap:60px;">
      <canvas id="calib-canvas" width="${canvasSizePx}" height="${canvasSizePx}"></canvas>
      <div style="display:flex; flex-direction:column; align-items:flex-start;">
        <p style="font-size:1.2em; margin-bottom:16px; max-width:280px;">Adjust each slider until no one color looks more salient than the others.</p>
        ${sliderRows}
        <button id="calib-confirm-btn" style="font-size:1.1em; padding:8px 24px; margin-top:8px; align-self:center;">Confirm</button>
      </div>
    </div>
  `;
}

// one calibration rep: dot positions are generated once (on_load) and never move again this rep --
// only their rendered color updates as sliders are dragged, since repositioning dots on every
// 'input' event would both be slow (rejection-sampled placement) and make brightness harder to
// judge. sliders start at an independent random position per color per rep, so nothing anchors on
// a previous rep's settings. Confirm calls jsPsych.finishTrial directly (this codebase's plugins
// already reference the global `jsPsych` instance elsewhere, e.g. getPxPerDeg's jsPsych.data.get())
// since html-keyboard-response with choices:'NO_KEYS' and no trial_duration otherwise never ends
function makeCalibrationRepTrial(calibState, subjectId, seed) {
  return {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: buildCalibrationTrialHtml,
    choices: 'NO_KEYS',
    data: { phase: 'color_calibration' },
    on_load: function () {
      const dotCloud = buildCalibrationDotCloud(CALIBRATION_DOTS_PER_COLOR);
      const gains = {};
      COLOR_NAMES.forEach(c => { gains[c] = CALIBRATION_FLOOR + Math.random() * (1 - CALIBRATION_FLOOR); });

      const canvas = document.getElementById('calib-canvas');
      const redraw = function () { drawCalibrationStimulus(canvas, dotCloud, gains); };

      COLOR_NAMES.forEach(color => {
        const slider = document.getElementById(`calib-slider-${color}`);
        slider.value = gains[color];
        slider.addEventListener('input', function () {
          gains[color] = Number(slider.value);
          redraw();
        });
      });
      redraw();

      document.getElementById('calib-confirm-btn').addEventListener('click', function () {
        jsPsych.finishTrial({ gains: { ...gains } });
      });
    },
    on_finish: function (data) {
      calibState.trialIndex += 1;
      calibState.repGains.push({ ...data.gains });
      calibState.rows.push(buildColorTrialInfo(data.gains, subjectId, seed, calibState.trialIndex));
      saveColorData(subjectId, calibState.rows);
    },
  };
}

// two-page calibration walkthrough (stimulus example, then task/slider explanation) shown before
// the matching reps begin. pages is a function (not a precomputed array) so it renders at trial
// runtime, once getPxPerDeg() actually resolves from the virtual chinrest trial that precedes this
// timeline -- same jsPsychInstructions plugin, and the same mouse (show_clickable_nav) + Left/Right
// arrow key navigation, as mainInstructionsTrial() in main_instructions.js
function calibrationInstructionsTrial() {
  return {
    type: jsPsychInstructions,
    pages: function () { return [buildStimulusPreviewScreen(), buildColorCalibrationMappingText()]; },
    show_clickable_nav: true,
    allow_backward: true,
    key_forward: 'ArrowRight',
    key_backward: 'ArrowLeft',
    data: { phase: 'color_calibration_instructions' },
  };
}

// runs (or resumes) N_COLOR_CALIBRATION_REPS matching reps, each preceded by its own fixation
// (same Fixation -> Stimulus convention as every other trial in this codebase), then averages the
// recorded per-rep gains into the final per-color gain and activates it
function buildColorCalibrationTimeline(calibState, subjectId, seed) {
  const timeline = [];
  timeline.push(calibrationInstructionsTrial());

  timeline.push({
    timeline: [makeFixationTrial(), makeCalibrationRepTrial(calibState, subjectId, seed)],
    loop_function: function () { return calibState.trialIndex < N_COLOR_CALIBRATION_REPS; },
  });

  timeline.push({
    type: jsPsychCallFunction,
    func: function () {
      calibState.gains = computeAverageGains(calibState.repGains);
      calibState.complete = true;
      setActiveColors(calibState.gains);
    },
  });

  return timeline;
}

</script>

<script>
// multi-page main-task instructions, shown once per session right after the color-calibration
// slot (ACTIVE_COLORS is always resolved by then -- either a fresh staircase result this session,
// or a prior session's saved gains, see runSession in session_flow.js). Pages are built at trial
// runtime via a function (not a precomputed array), mirroring color_calibration.js's
// buildStimulusPreviewScreen, since getPxPerDeg() only resolves after the virtual chinrest has
// already run this session. Uses PREVIEW_SCALE/PREVIEW_SUPERSAMPLE from color_calibration.js so
// the dot-cloud/legend illustrations read at the same scaled-down size as the calibration screens

// fixed illustrative trial: a large gap between the top color and every distractor so the "MOST
// dots" question has an obvious answer, well outside any real condition's difficulty range (the
// closest real condition is [100, 60, 60, 60]). the top count matches this design's real top of
// 100 so the illustration's density is representative
const INSTRUCTION_FULL_TRIAL = { n_choice: 4, colors: COLOR_NAMES, counts: [100, 25, 25, 25], correct_color: 'orange' };

// same illustrative trial restricted to 3 colors, to demonstrate the greyed-out legend shown on
// n_choice < 4 trials. this experiment has no two-choice conditions, so the partial example is
// 3-choice (the previous experiment's was 2-choice) -- showing a 2-color example here would
// advertise a trial type the subject will never actually see
const INSTRUCTION_PARTIAL_TRIAL = { n_choice: 3, colors: ['orange', 'green', 'blue'], counts: [100, 25, 25], correct_color: 'orange' };

// draws one illustrative trial's dot cloud, scaled to PREVIEW_SCALE like color_calibration.js's
// drawStimulusPreview, but colored via the resolved ACTIVE_COLORS palette rather than a
// calibration gain, since these screens run after calibration is complete
function drawInstructionDots(ctx, cx, cy, trial) {
  const pxPerDeg = getPxPerDeg() * PREVIEW_SCALE * PREVIEW_SUPERSAMPLE;
  const dotRadiusPx = DOT_RADIUS_DEG * pxPerDeg;

  buildDotCloud(trial).forEach(dot => {
    ctx.beginPath();
    ctx.arc(cx + dot.pos[0] * pxPerDeg, cy - dot.pos[1] * pxPerDeg, dotRadiusPx, 0, 2 * Math.PI);
    ctx.fillStyle = ACTIVE_COLORS[dot.color];
    ctx.fill();
  });
}

// draws the fixed HJKL legend row, mirroring drawColorLegend's real geometry (expt_util.js)
// scaled to PREVIEW_SCALE -- validColors controls which keys show their real color vs. the same
// UNAVAILABLE_LEGEND_COLOR grey used on real trials with fewer than 4 colors
function drawInstructionLegend(ctx, cx, cy, validColors) {
  const pxPerDeg = getPxPerDeg() * PREVIEW_SCALE * PREVIEW_SUPERSAMPLE;
  const legendXDeg = [-9, -3, 3, 9].map(x => x * VISUAL_ANGLE_SCALE);
  const rectWidthPx = 4 * VISUAL_ANGLE_SCALE * pxPerDeg;
  const rectHeightPx = 3 * VISUAL_ANGLE_SCALE * pxPerDeg;

  COLOR_NAMES.forEach((color, i) => {
    const x = cx + legendXDeg[i] * pxPerDeg;
    ctx.fillStyle = validColors.includes(color) ? ACTIVE_COLORS[color] : UNAVAILABLE_LEGEND_COLOR;
    ctx.strokeStyle = 'white';
    ctx.fillRect(x - rectWidthPx / 2, cy - rectHeightPx / 2, rectWidthPx, rectHeightPx);
    ctx.strokeRect(x - rectWidthPx / 2, cy - rectHeightPx / 2, rectWidthPx, rectHeightPx);

    ctx.fillStyle = 'black';
    ctx.font = `bold ${20 * VISUAL_ANGLE_SCALE * PREVIEW_SCALE * PREVIEW_SUPERSAMPLE}px Avenir Next, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(COLOR_KEYS[color].toUpperCase(), x, cy);
  });
}

// canvas size + vertical anchor points for a dots(+legend) illustration -- wide enough for
// whichever is wider (the aperture or the full legend row), tall enough to fit the legend below
// the aperture only when this page actually shows one
function computeDecisionPreviewLayout(showLegend) {
  const pxPerDeg = getPxPerDeg() * PREVIEW_SCALE * PREVIEW_SUPERSAMPLE;
  const apertureRadiusPx = APERTURE_RADIUS_DEG * pxPerDeg;
  const legendGapPx = 3 * VISUAL_ANGLE_SCALE * pxPerDeg;
  const legendHeightPx = 3 * VISUAL_ANGLE_SCALE * pxPerDeg;
  const legendHalfSpanPx = (9 + 2) * VISUAL_ANGLE_SCALE * pxPerDeg;

  const widthPx = Math.ceil(Math.max(2 * apertureRadiusPx, 2 * legendHalfSpanPx) + 20);
  const apertureCy = 10 + apertureRadiusPx;
  const belowAperturePx = showLegend ? legendGapPx + legendHeightPx : 0;
  const heightPx = Math.ceil(apertureCy + apertureRadiusPx + belowAperturePx + 10);

  return { widthPx, heightPx, apertureCy, legendCy: apertureCy + apertureRadiusPx + legendGapPx + legendHeightPx / 2 };
}

// renders one dots(+legend) illustration to a data URL for embedding in an instructions page
function buildDecisionPreviewImage(trial, showLegend) {
  const layout = computeDecisionPreviewLayout(showLegend);
  const canvas = document.createElement('canvas');
  canvas.width = layout.widthPx;
  canvas.height = layout.heightPx;
  const ctx = canvas.getContext('2d');

  drawInstructionDots(ctx, layout.widthPx / 2, layout.apertureCy, trial);
  if (showLegend) drawInstructionLegend(ctx, layout.widthPx / 2, layout.legendCy, trial.colors);

  return { src: canvas.toDataURL(), displayWidthPx: layout.widthPx / PREVIEW_SUPERSAMPLE };
}

// confidence-screen illustration: literal readable prompt text, not shrunk by PREVIEW_SCALE like
// the dots/legend illustrations above -- there's no aperture geometry to fit on the page, and this
// text matches the real confidence trial's prompt exactly (see makeConfidenceTrial in expt_util.js)
function buildConfidencePreviewImage() {
  const widthPx = 620 * PREVIEW_SUPERSAMPLE;
  const heightPx = 50 * PREVIEW_SUPERSAMPLE;
  const canvas = document.createElement('canvas');
  canvas.width = widthPx;
  canvas.height = heightPx;

  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'white';
  ctx.font = `${24 * VISUAL_ANGLE_SCALE * PREVIEW_SUPERSAMPLE}px Avenir Next, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('How confident are you? (1 = low, 4 = high)', widthPx / 2, heightPx / 2);

  return { src: canvas.toDataURL(), displayWidthPx: widthPx / PREVIEW_SUPERSAMPLE };
}

// six pages: (1) task goal with an easy example, (2) the same example's answer revealed, (3) the
// full HJKL response mapping, (4) the greyed-out legend for <4-color trials, (5) the confidence
// scale, (6) a review reminder plus a preview of the upcoming practice block's feedback structure
// -- trial counts are read from the same config constants that build the practice blocks
// (buildDay1PracticeBlocks/buildRepeatPracticeBlocks in triallist.js) so this text can't drift out
// of sync with the actual practice trial counts
function buildMainInstructionsPages(isFirstSession) {
  const practiceFeedbackTrials = isFirstSession ? N_PRACTICE_MIXED_DAY1 : N_PRACTICE_MIXED_REPEAT;
  const practiceNoFeedbackTrials = isFirstSession ? 0 : N_PRACTICE_MIXED_REPEAT;
  const practiceTotalTrials = practiceFeedbackTrials + practiceNoFeedbackTrials;
  const correctColorLabel = capitalizeColorName(INSTRUCTION_FULL_TRIAL.correct_color);
  const correctColorKey = COLOR_KEYS[INSTRUCTION_FULL_TRIAL.correct_color].toUpperCase();
  const fullImg = buildDecisionPreviewImage(INSTRUCTION_FULL_TRIAL, false);
  const mappingImg = buildDecisionPreviewImage(INSTRUCTION_FULL_TRIAL, true);
  const partialImg = buildDecisionPreviewImage(INSTRUCTION_PARTIAL_TRIAL, true);
  const confidenceImg = buildConfidencePreviewImage();

  return [
    `<div style="font-size:1.4em;">
      <p><img src="${fullImg.src}" style="width:${fullImg.displayWidthPx}px;"></p>
      <p>In this task, you'll be seeing clouds of colored dots.</p>
      <p>Your task is to decide which color has the MOST number of dots.</p>
      <p>The dot cloud will be visible for varying, sometimes very brief amounts of time, followed by a flash of colored dots. This is expected.</p>
    </div>`,
    `<div style="font-size:1.4em;">
      <p><img src="${fullImg.src}" style="width:${fullImg.displayWidthPx}px;"></p>
      <p>In this example, the correct answer is ${correctColorLabel}.</p>
    </div>`,
    `<div style="font-size:1.4em;">
      <p><img src="${mappingImg.src}" style="width:${mappingImg.displayWidthPx}px;"></p>
      <p>To indicate your response, use H, J, K, or L to report the color with the most number of dots.</p>
      <p>Since ${correctColorLabel} has the most dots in this example, press ${correctColorKey} to indicate your response.</p>
      <p>This will be shown on every trial, so you do not have to remember them.</p>
    </div>`,
    `<div style="font-size:1.4em;">
      <p><img src="${partialImg.src}" style="width:${partialImg.displayWidthPx}px;"></p>
      <p>On trials with only 3 colors, the unavailable option is greyed out.</p>
      <p>You will not be able to respond using those keys.</p>
    </div>`,
    `<div style="font-size:1.4em;">
      <p><img src="${confidenceImg.src}" style="width:${confidenceImg.displayWidthPx}px;"></p>
      <p>After indicating your decision, you will be asked to report your confidence.</p>
      <p>1 = very low confidence</p>
      <p>2 = low confidence</p>
      <p>3 = high confidence</p>
      <p>4 = very high confidence</p>
    </div>`,
    `<div style="font-size:1.4em;">
      <p>If you're unsure about the task, please go back and review.</p>
      <p>You will now perform ${practiceTotalTrials} practice trials${practiceNoFeedbackTrials
        ? `. You will receive feedback for the first ${practiceFeedbackTrials} trials.`
        : ', with feedback.'}</p>
      <p>${practiceNoFeedbackTrials ? `No feedback will be given in the last ${practiceNoFeedbackTrials} trials and in ` : 'No feedback will be given in '}the experimental trials.</p>
    </div>`,
  ];
}

// Right Arrow (or the on-screen Next button) advances, Left Arrow (or Previous) goes back -- pages
// is a function so it's rebuilt fresh (and re-reads ACTIVE_COLORS) every time this trial actually
// runs. isFirstSession selects the day-1 vs. repeat-session practice trial counts on the last page
function mainInstructionsTrial(isFirstSession) {
  return {
    type: jsPsychInstructions,
    pages: () => buildMainInstructionsPages(isFirstSession),
    show_clickable_nav: true,
    allow_backward: true,
    key_forward: 'ArrowRight',
    key_backward: 'ArrowLeft',
    data: { phase: 'main_instructions' },
  };
}

</script>

<script>
function rowToCsvLine(row) {
  const fields = [
    row.date, row.time, row.sid, row.seed,
    row.gain_orange, row.gain_green, row.gain_blue, row.gain_magenta,
    row.session, row.trial, row.duration,
    row.n_choice, row.condition_id, row.top, row.ratio_1, row.ratio_2, row.ratio_3,
    `[${row.colors.join(',')}]`, `[${row.counts.join(',')}]`,
    row.stim, row.resp, row.acc, row.rt, row.conf, row.c_rt,
  ];
  return fields.map(csvField).join(',');
}

// builds the saved-data row for one trial, mirrors the pilot's get_trial_info column-for-column
// plus session/gain columns, with conf/c_rt populated (unlike the pilot, which always leaves them
// blank). gains are this subject's resolved color-calibration result, constant across a session
function buildTrialInfo(trial, result, subjectId, seed, trialIndex, gains) {
  const now = new Date();
  const ratios = [null, null, null];
  trial.ratios.forEach((r, i) => { ratios[i] = r; });

  return {
    date: formatDate(now), time: formatTime(now),
    sid: subjectId, seed: seed,
    gain_orange: gains.orange, gain_green: gains.green, gain_blue: gains.blue, gain_magenta: gains.magenta,
    session: trial.session, trial: trialIndex, duration: trial.duration,
    n_choice: trial.n_choice, condition_id: trial.condition_id, top: trial.top,
    ratio_1: ratios[0] ?? '', ratio_2: ratios[1] ?? '', ratio_3: ratios[2] ?? '',
    colors: trial.colors.map(c => COLOR_CODES[c]),
    counts: trial.counts,
    stim: COLOR_CODES[trial.correct_color],
    resp: COLOR_CODES[result.resp],
    acc: result.acc, rt: result.rt, conf: result.conf, c_rt: result.c_rt,
  };
}

// re-posts the WHOLE accumulated session so far after every trial, overwriting the file in place
// server-side -- same crash-safe philosophy as the pilot's save_trial_data. enqueueSave (in
// expt_util.js) adds retry-with-backoff and write-ordering on top of the plain fetch this used to be.
// sessionData holds already-formatted CSV lines (see buildMainTimeline/runSession), not row objects,
// so a resumed session's carried-forward lines (from progress.php) can sit alongside freshly-built
// ones without re-parsing anything
function saveSessionData(subjectId, session, sessionData) {
  if (!serverAvailable) return Promise.resolve();
  const csvText = CSV_HEADER + '\n' + sessionData.join('\n');
  return enqueueSave('save.php', { subject_id: subjectId, session, csv: csvText });
}

// no subject label to build a meaningful name from anymore -- the researcher renames the
// downloaded file themself
function sessionDataFilename() {
  return 'rename.csv';
}

// any failure here -- fetch() throwing outright under file://, or a 404/non-JSON body when no
// PHP handler exists -- is treated the same way: no server, so run fresh with no resume, and flip
// serverAvailable so every later save this session skips straight to the local CSV download
// instead of retrying against endpoints that were never going to answer
async function fetchProgress(subjectId) {
  try {
    const res = await fetch(`progress.php?subject_id=${encodeURIComponent(subjectId)}`);
    const body = await res.text();
    return JSON.parse(body);
  } catch (error) {
    serverAvailable = false;
    return { sessions: [], color_rows: [] };
  }
}

// decides what to run next from the server's report of existing session files: resume a
// partially-saved session (crash recovery, skips to the first unsaved trial), move on to the
// next fresh session, or report the study complete. resumeLines carries forward the raw CSV lines
// already on disk for a resumed session (progress.php now returns them, not just a row count) --
// without this, saveSessionData would overwrite the file with only the post-resume trials and
// silently discard every row saved before the crash
function resolveSessionPlan(progress) {
  const bySession = {};
  progress.sessions.forEach(s => { bySession[s.session] = s; });

  for (let s = N_SESSIONS; s >= 1; s--) {
    if (bySession[s] !== undefined && bySession[s].rows < SESSION_SIZE) {
      return { status: 'run', session: s, resumeFromTrial: bySession[s].rows, isFirstSession: s === 1, resumeLines: bySession[s].lines };
    }
  }

  const completeSessions = Object.keys(bySession).map(Number).filter(s => bySession[s].rows >= SESSION_SIZE);
  const nextSession = completeSessions.length ? Math.max(...completeSessions) + 1 : 1;

  if (nextSession > N_SESSIONS) return { status: 'done' };
  return { status: 'run', session: nextSession, resumeFromTrial: 0, isFirstSession: nextSession === 1, resumeLines: [] };
}

// shown before the virtual chinrest every session, including resumed ones -- chinrestTrial()
// itself always runs regardless of resumeFromTrial, so this intro runs alongside it every time
function chinrestIntroTrial(isFirstSession) {
  return {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: isFirstSession ? CHINREST_INTRO_TEXT_FIRST : CHINREST_INTRO_TEXT_RETURNING,
    choices: [' '],
  };
}

function transitionMessageTrial() {
  return { type: jsPsychHtmlKeyboardResponse, stimulus: buildTransitionText(), choices: 'ALL_KEYS' };
}

// countdown text is updated live via on_load/setInterval since html-keyboard-response's stimulus
// is static markup -- interval is cleared on_finish whether the trial ends via timeout or the
// subject skipping early with spacebar. percent complete is relative to the whole session
// (SESSION_SIZE), not just the remaining trials passed into buildMainTimeline
function buildBreakTimeline(trialIndex) {
  const percentComplete = Math.round((trialIndex / SESSION_SIZE) * 100);
  // trialIndex is always a multiple of N_TRIAL_TO_BREAK here (that's the trigger condition at the
  // call site), so blocksCompleted is exact -- runs/blocks are both reported 1-indexed
  const blocksCompleted = trialIndex / N_TRIAL_TO_BREAK;
  const currentRun = Math.ceil(blocksCompleted / BLOCKS_PER_RUN);
  const blockInRun = ((blocksCompleted - 1) % BLOCKS_PER_RUN) + 1;
  let countdownInterval = null;

  return [
    {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <p id="break-timer" style="font-size:4em;">${BREAK_DURATION}</p>
        <p>Great, you've completed ${percentComplete}% of the trials for today, time to take a break.</p>
        <p>If you wish to continue without a break, press spacebar.</p>
      `,
      choices: [' '],
      trial_duration: BREAK_DURATION * 1000,
      on_load: function () {
        let remaining = BREAK_DURATION;
        const timerEl = document.getElementById('break-timer');
        countdownInterval = setInterval(function () {
          remaining -= 1;
          timerEl.textContent = Math.max(remaining, 0);
        }, 1000);
      },
      on_finish: function () {
        clearInterval(countdownInterval);
      },
    },
    {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <p>Press spacebar to continue to the next block.</p>
        <p>RUN: ${currentRun}/${RUNS_PER_SESSION}</p>
        <p>BLOCK: ${blockInRun}/${BLOCKS_PER_RUN}</p>
      `,
      choices: [' '],
    },
  ];
}

// practice trials always include confidence (the main experiment never skips it, unlike the
// pilot's pilot=True flag) and are never saved to disk -- same convention as the pilot. feedback is
// a per-block flag (see buildDay1PracticeBlocks/buildRepeatPracticeBlocks in triallist.js), since
// some practice blocks are run without it
function buildPracticeTimeline(trials, feedback) {
  const nodes = [];
  trials.forEach(trial => {
    const result = {};
    const trialTimeline = [
      makeFixationTrial(),
      makeStimulusTrial(trial),
      makeDecisionTrial(trial, result),
      makeConfidenceTrial(result),
    ];
    if (feedback) trialTimeline.push(makeFeedbackTrial(trial, result));
    nodes.push(makePauseableTrial(trialTimeline));
  });
  return nodes;
}

// main trials: no feedback, confidence enabled, saved after every trial. startIndex lets a
// resumed session continue the `trial` column where the last save left off. `calibState` is read
// at on_finish time (not build time), so it always reflects this subject's resolved color gains
// even though calibration finishes later in the same timeline than this function is called
function buildMainTimeline(trials, subjectId, seed, session, sessionData, startIndex, calibState) {
  const nodes = [];
  trials.forEach((trial, i) => {
    const trialIndex = startIndex + i;
    if (trialIndex > 0 && trialIndex % N_TRIAL_TO_BREAK === 0) {
      nodes.push(...buildBreakTimeline(trialIndex));
    }

    const result = {};
    nodes.push(makePauseableTrial([
      makeFixationTrial(),
      makeStimulusTrial(trial),
      makeDecisionTrial(trial, result),
      makeConfidenceTrial(result, function () {
        sessionData.push(rowToCsvLine(buildTrialInfo(trial, result, subjectId, seed, trialIndex, calibState.gains)));
        saveSessionData(subjectId, session, sessionData);
      }),
    ]));
  });
  return nodes;
}

// local-backup screen shown at the end of every session, after the server save (enqueueSave, with
// its own retries) has settled -- gives the subject their own copy on disk regardless of whether
// the server-side copy succeeded. choices: 'NO_KEYS' plus a manual jsPsych.finishTrial() from the
// button (same pattern as makeCalibrationRepTrial's confirm button) means the trial can't be
// skipped without actually triggering the download
function buildLocalSaveTrial(subjectId, session, sessionData) {
  return {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <p>${LOCAL_SAVE_PROMPT_TEXT}</p>
      <button id="local-save-btn" style="font-size:1.1em; padding:8px 24px;">Save Data to Computer</button>
    `,
    choices: 'NO_KEYS',
    data: { phase: 'local_save_prompt' },
    on_load: function () {
      document.getElementById('local-save-btn').addEventListener('click', function () {
        const csvText = CSV_HEADER + '\n' + sessionData.join('\n');
        downloadCsvText(sessionDataFilename(), csvText);
        jsPsych.finishTrial();
      });
    },
  };
}

// waits for the server save to settle (success or every retry exhausted, see enqueueSave), reports
// failure plainly instead of the old behavior of proceeding either way, then always prompts a local
// download as a backup -- saveStatus is read by the next trial's stimulus function, which only runs
// after this callFunction trial has already finished
function sessionCompleteTimeline(subjectId, session, sessionData) {
  const saveStatus = { ok: true };
  return [
    {
      type: jsPsychCallFunction,
      async: true,
      func: function (done) {
        lastSaveResponse.then(() => { saveStatus.ok = true; done(); })
          .catch(() => { saveStatus.ok = false; done(); });
      },
    },
    {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: function () { return saveStatus.ok ? SESSION_COMPLETE_TEXT : SAVE_FAILED_TEXT; },
      choices: 'NO_KEYS',
      trial_duration: 4000,
      data: { phase: 'session_complete' },
    },
    buildLocalSaveTrial(subjectId, session, sessionData),
  ];
}

function showCompletionScreen() {
  document.getElementById('jspsych-target').innerHTML = STUDY_COMPLETE_TEXT;
}
